[project]
name = "provisioning-automation"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2.0",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.28",
    "typer>=0.16",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning"]

